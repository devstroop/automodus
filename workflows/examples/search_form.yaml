# Search Form Interaction Workflow
# Demonstrates click, type, and wait_for actions

name: search_form
description: Fill and submit a search form on DuckDuckGo
version: "1.0"

browser:
  headless: false

params:
  query:
    type: string
    required: true
    default: "browser automation"

triggers:
  manual: true
  api:
    path: /search
    method: POST

steps:
  # Navigate to DuckDuckGo
  - id: navigate
    action: goto
    url: "https://duckduckgo.com"

  # Wait for search input to be ready
  - id: wait_for_input
    action: wait_for
    selector: "input[name='q']"
    timeout: 10000

  # Type search query
  - id: type_query
    action: type
    selector: "input[name='q']"
    text: "{{params.query}}"
    clear: true

  # Click search button
  - id: click_search
    action: click
    selector: "button[type='submit']"

  # Wait for results to load
  - id: wait_for_results
    action: wait_for
    selector: "[data-testid='result']"
    timeout: 15000

  # Extract first result title
  - id: extract_first_result
    action: extract
    selector: "[data-testid='result-title-a']"
    as: first_result

  # Take screenshot of results
  - id: screenshot_results
    action: screenshot
    path: "data/screenshots/search_results.png"

  # Log completion
  - id: log_done
    action: log
    message: "Search completed for: {{params.query}}"

output:
  query: "{{params.query}}"
  first_result: "{{store.first_result}}"
  screenshot: "data/screenshots/search_results.png"

on_error:
  screenshot: true
  emit:
    event: search_failed
