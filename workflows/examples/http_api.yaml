# HTTP API Example Workflow
#
# Demonstrates HTTP actions for making API requests within workflows.
# This example fetches data from JSONPlaceholder (a fake REST API).

name: http_api_example
version: "1.0"
description: Demonstrates HTTP actions for API integrations

on:
  api:
    path: /workflows/http-example
    method: POST

params:
  user_id:
    type: number
    default: 1
    description: User ID to fetch

steps:
  # 1. Fetch user data from API
  - action: http.get
    url: "https://jsonplaceholder.typicode.com/users/{{params.user_id}}"
    store_as: user_response
    id: fetch_user

  - action: log
    message: "Fetched user: {{store.user_response.body.name}}"

  # 2. Fetch user's posts
  - action: http.get
    url: "https://jsonplaceholder.typicode.com/posts?userId={{params.user_id}}"
    store_as: posts_response
    id: fetch_posts

  - action: log
    message: "Found {{store.posts_response.body.length}} posts"

  # 3. Create a new post (POST request)
  - action: http.post
    url: "https://jsonplaceholder.typicode.com/posts"
    headers:
      Content-Type: "application/json"
    body:
      title: "Automodus Test Post"
      body: "Created via workflow automation"
      userId: "{{params.user_id}}"
    store_as: create_response
    id: create_post

  - action: log
    message: "Created post with ID: {{store.create_response.body.id}}"

  # 4. Update the post (PUT request)
  - action: http.put
    url: "https://jsonplaceholder.typicode.com/posts/{{store.create_response.body.id}}"
    body:
      title: "Updated Title"
      body: "Updated via workflow"
      userId: "{{params.user_id}}"
    store_as: update_response
    id: update_post

  # 5. Partial update (PATCH request)
  - action: http.patch
    url: "https://jsonplaceholder.typicode.com/posts/1"
    body:
      title: "Patched Title"
    store_as: patch_response
    id: patch_post

  # 6. Delete (simulated)
  - action: http.delete
    url: "https://jsonplaceholder.typicode.com/posts/1"
    store_as: delete_response
    id: delete_post

output:
  user: "{{store.user_response.body}}"
  posts_count: "{{store.posts_response.body.length}}"
  created_post_id: "{{store.create_response.body.id}}"
  operations_completed:
    - GET user
    - GET posts
    - POST create
    - PUT update
    - PATCH partial
    - DELETE remove
