# Composed Workflow Example
#
# Demonstrates workflow composition using `call` to invoke reusable sub-workflows.
# Instead of one massive YAML file, break flows into reusable building blocks:
#
#   pipeline.yaml
#   ├── call: login.yaml       (authenticate)
#   ├── ... do work ...
#   ├── call: capture.yaml     (screenshot results)
#   └── on_error: capture.yaml (screenshot on failure)
#
# Sub-workflows:
#   - login.yaml   — reusable login flow (accepts url, username, password)
#   - capture.yaml — reusable screenshot (accepts name, full_page)

name: compose_pipeline
version: "1.0"
description: Demonstrates workflow composition with call action

browser:
  headless: false

params:
  site_url:
    type: string
    default: "https://example.com/login"
  username:
    type: string
    default: "demo"
  password:
    type: string
    default: "demo123"

steps:
  # 1. Call the reusable login workflow
  - id: auth
    action: call
    workflow: examples/compose/login
    params:
      url: "{{params.site_url}}"
      username: "{{params.username}}"
      password: "{{params.password}}"
    store_as: login_result

  - action: log
    message: "Login complete — redirected to {{store.login_result.url}}"

  # 2. Do some work on the authenticated page
  - action: goto
    url: "{{store.login_result.url}}/settings"

  - action: wait_for
    selector: "body"
    timeout: "5s"

  # 3. Capture a screenshot using the reusable capture workflow
  - action: call
    workflow: examples/compose/capture
    params:
      name: "settings_page"
      full_page: true
    store_as: screenshot_result

  - action: log
    message: "Screenshot saved to {{store.screenshot_result.path}}"

output:
  login: "{{store.login_result}}"
  screenshot: "{{store.screenshot_result.path}}"

on_error:
  screenshot: true
  steps:
    - action: log
      message: "Pipeline failed — check screenshots"
