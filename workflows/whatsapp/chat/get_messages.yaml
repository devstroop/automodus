# WhatsApp Get Messages Workflow
#
# Retrieves messages from a specific chat.
# Can navigate to a chat by chat_id (phone number or name).

name: whatsapp_get_messages
version: "1.0"
description: Get messages from a WhatsApp chat

browser:
  headless: false
  data_dir: "data/whatsapp_profile"

on:
  api:
    path: /whatsapp/messages
    method: GET

params:
  chat_id:
    type: string
    required: true
    description: "Chat ID (phone number, JID, or name:ContactName)"
  limit:
    type: number
    default: 50
    description: "Maximum messages to retrieve"
  load_more:
    type: boolean
    default: false
    description: "Scroll to load more messages"

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  # 1. Navigate to WhatsApp
  - id: navigate
    action: goto
    url: "{{vars.whatsapp_url}}"

  # 2. Check authorization
  - id: check_auth
    action: eval
    script: "document.querySelector('#pane-side') !== null"
    store_as: is_authenticated

  - action: condition
    if: "{{store.is_authenticated}} == false"
    then:
      - action: eval
        script: "({ messages: [], error: 'Not authenticated' })"
        store_as: result
    else:
      # 3. Determine navigation method
      - id: parse_chat_id
        action: eval
        script: |
          (function() {
            var chatId = '{{params.chat_id}}';
            if (chatId.startsWith('name:')) {
              return { type: 'name', value: chatId.substring(5) };
            } else if (chatId.includes('@')) {
              return { type: 'phone', value: chatId.split('@')[0] };
            } else if (/^[\d+]+$/.test(chatId.replace(/[^\d+]/g, ''))) {
              return { type: 'phone', value: chatId.replace(/[^\d+]/g, '').replace(/^\+/, '') };
            } else {
              return { type: 'name', value: chatId };
            }
          })();
        store_as: chat_info

      # 4. Navigate to chat
      - action: condition
        if: "{{store.chat_info.type}} == 'name'"
        then:
          # Click on chat by name in sidebar
          - id: click_chat_by_name
            action: eval
            script: |
              (function() {
                var targetName = '{{store.chat_info.value}}';
                var rows = document.querySelectorAll('[role="listitem"], [role="row"], [data-testid="cell-frame-container"]');
                for (var row of rows) {
                  var nameEl = row.querySelector('[data-testid="cell-frame-title"] span') ||
                               row.querySelector('span[title]') ||
                               row.querySelector('[dir="auto"]');
                  if (nameEl && (nameEl.title === targetName || nameEl.innerText === targetName)) {
                    row.click();
                    return true;
                  }
                }
                return false;
              })();
            store_as: clicked_chat
        else:
          # Navigate by phone number
          - id: navigate_by_phone
            action: eval
            script: |
              (function() {
                var phone = '{{store.chat_info.value}}';
                var loader = document.querySelector('#phoneLoaderParent');
                if (!loader) {
                  document.querySelector('#pane-side').innerHTML += '<div id="phoneLoaderParent"></div>';
                }
                document.querySelector('#phoneLoaderParent').innerHTML = 
                  '<a id="phoneLoader" href="https://api.whatsapp.com/send?phone=' + phone + '" style="display:none"></a>';
                document.querySelector('#phoneLoader').click();
                document.querySelector('#phoneLoaderParent').remove();
                return true;
              })();

      - action: sleep
        duration: "2s"

      # 5. Load more messages if requested
      - action: condition
        if: "{{params.load_more}} == true"
        then:
          - id: scroll_up
            action: eval
            script: |
              (function() {
                var container = document.querySelector('[role="application"]') ||
                                document.querySelector('[data-testid="conversation-panel-messages"]')?.parentElement;
                if (container) {
                  container.scrollTop = 0;
                  return true;
                }
                return false;
              })();
          - action: sleep
            duration: "1s"

      # 6. Extract messages
      - id: extract_messages
        action: eval
        script: |
          (function() {
            var messages = [];
            var limit = {{params.limit}};
            var msgElements = document.querySelectorAll('[data-id]');
            
            msgElements.forEach(function(el) {
              if (messages.length >= limit) return;
              
              try {
                var dataId = el.getAttribute('data-id');
                if (!dataId || !dataId.includes('@')) return;
                
                var fromMe = dataId.startsWith('true_');
                
                // Get message text
                var text = null;
                var copyableSpans = el.querySelectorAll('span.copyable-text');
                for (var span of copyableSpans) {
                  var t = span.innerText?.trim();
                  if (t && t.length > 0 && !t.match(/^\d{1,2}:\d{2}$/)) {
                    text = t;
                    break;
                  }
                }
                
                // Fallback for message text
                if (!text) {
                  var ao3e = el.querySelector('span._ao3e');
                  if (ao3e) {
                    var t = ao3e.innerText?.trim();
                    if (t && !t.match(/^\d{1,2}:\d{2}$/)) {
                      text = t;
                    }
                  }
                }
                
                // Get timestamp
                var timestamp = null;
                var preTextEl = el.querySelector('[data-pre-plain-text]');
                if (preTextEl) {
                  var preText = preTextEl.getAttribute('data-pre-plain-text');
                  if (preText) {
                    timestamp = preText.replace(/[\[\]]/g, '').trim();
                  }
                }
                if (!timestamp) {
                  var timeEl = el.querySelector('[data-testid="msg-meta"] span');
                  if (timeEl) timestamp = timeEl.innerText;
                }
                
                // Get sender for group chats
                var senderEl = el.querySelector('[data-testid="msg-container"] span[aria-label]');
                var sender = senderEl ? senderEl.getAttribute('aria-label')?.replace(':', '') : null;
                
                // Determine message type
                var msgType = 'chat';
                if (el.querySelector('[data-testid="image-thumb"]') || el.querySelector('img[src*="blob:"]')) {
                  msgType = 'image';
                } else if (el.querySelector('[data-testid="video-thumb"]') || el.querySelector('video')) {
                  msgType = 'video';
                } else if (el.querySelector('[data-testid="audio-play"]') || el.querySelector('audio')) {
                  msgType = 'audio';
                } else if (el.querySelector('[data-testid="document-thumb"]')) {
                  msgType = 'document';
                } else if (el.querySelector('[data-testid="location"]')) {
                  msgType = 'location';
                } else if (el.querySelector('[data-testid="sticker"]')) {
                  msgType = 'sticker';
                }
                
                // Get status
                var status = null;
                var statusEl = el.querySelector('[data-testid="msg-dblcheck"]') ||
                               el.querySelector('[data-testid="msg-check"]');
                if (statusEl) {
                  var icon = statusEl.getAttribute('data-testid');
                  if (icon && icon.includes('dblcheck')) {
                    status = el.querySelector('[data-icon="msg-dblcheck-ack"]') ? 'read' : 'delivered';
                  } else {
                    status = 'sent';
                  }
                }
                
                messages.push({
                  id: dataId,
                  from_me: fromMe,
                  sender: sender,
                  text: text,
                  message_type: msgType,
                  timestamp: timestamp,
                  status: status
                });
              } catch(e) {
                // Skip problematic messages
              }
            });
            
            return messages;
          })();
        store_as: messages

      # 7. Get chat name
      - id: get_chat_name
        action: eval
        script: |
          (function() {
            var header = document.querySelector('[data-testid="conversation-info-header-chat-title"]') ||
                         document.querySelector('#main header span[title]');
            return header ? header.innerText || header.title : null;
          })();
        store_as: chat_name

      - action: eval
        script: |
          ({
            messages: {{store.messages}},
            chat_id: '{{params.chat_id}}',
            chat_name: '{{store.chat_name}}',
            count: {{store.messages}}.length,
            has_more: {{store.messages}}.length >= {{params.limit}}
          })
        store_as: result

  - action: log
    message: "Retrieved {{store.result.count}} messages from {{store.result.chat_name}}"

output:
  messages: "{{store.result.messages}}"
  chat_id: "{{store.result.chat_id}}"
  chat_name: "{{store.result.chat_name}}"
  count: "{{store.result.count}}"
  has_more: "{{store.result.has_more}}"

on_error:
  emit:
    event: whatsapp_get_messages_error
