# WhatsApp Watch Messages Workflow
#
# Watches for new incoming messages using an event-driven approach.
# Injects a MutationObserver + Notification API interceptor.
# Call repeatedly to drain the message queue.

name: whatsapp_watch_messages
version: "1.0"
description: Watch for new incoming WhatsApp messages

browser:
  headless: false
  data_dir: "data/whatsapp_profile"

on:
  api:
    path: /whatsapp/watch
    method: GET

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  # 1. Ensure WhatsApp Web is ready
  - action: call
    workflow: _common/ensure_ready
    store_as: ready

  - action: condition
    if: "{{store.ready.authorized}} == false"
    then:
      - action: eval
        script: "({ messages: [], status: 'not_authenticated' })"
        store_as: result
    else:
      # 2. Inject message listener if not already active
      - id: inject_listener
        action: eval
        script: |
          (function() {
            // Check if already active
            if (window.__WAS_LISTENER_ACTIVE) {
              // Verify queue exists
              if (typeof window.__WAS_MESSAGE_QUEUE !== 'undefined') {
                return { status: 'already_active' };
              }
            }
            
            window.__WAS_LISTENER_ACTIVE = true;
            window.__WAS_MESSAGE_QUEUE = [];
            window.__WAS_PROCESSED_IDS = new Set();
            
            // Generate unique ID
            function generateId() {
              return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
            }
            
            // Extract message from chat row
            function extractMessageFromRow(row) {
              if (!row) return null;
              
              var nameEl = row.querySelector('span[title]');
              var msgEl = row.querySelector('[data-testid="last-msg-status"]')?.parentElement ||
                          row.querySelector('[data-testid="cell-frame-secondary"]');
              var timeEl = row.querySelector('[data-testid="cell-frame-primary-detail"]');
              var unreadBadge = row.querySelector('[data-testid="icon-unread-count"]');
              
              if (!nameEl || !msgEl) return null;
              
              var chatName = nameEl.title || nameEl.innerText;
              var messageText = msgEl.innerText;
              var uniqueKey = chatName + ':' + messageText;
              
              if (window.__WAS_PROCESSED_IDS.has(uniqueKey)) return null;
              window.__WAS_PROCESSED_IDS.add(uniqueKey);
              
              // Limit set size
              if (window.__WAS_PROCESSED_IDS.size > 500) {
                var arr = Array.from(window.__WAS_PROCESSED_IDS);
                window.__WAS_PROCESSED_IDS = new Set(arr.slice(-250));
              }
              
              return {
                id: generateId(),
                from_me: false,
                sender: chatName,
                text: messageText,
                message_type: 'chat',
                timestamp: timeEl ? timeEl.innerText : null,
                timestamp_unix: Date.now(),
                has_unread: !!unreadBadge
              };
            }
            
            // Setup chat list observer
            function setupObserver() {
              var chatList = document.querySelector('#pane-side') ||
                             document.querySelector('[data-testid="chat-list"]');
              
              if (!chatList) {
                setTimeout(setupObserver, 2000);
                return;
              }
              
              var observer = new MutationObserver(function(mutations) {
                for (var mutation of mutations) {
                  if (mutation.type === 'attributes' || mutation.type === 'childList') {
                    var target = mutation.target;
                    var row = target.closest('[role="listitem"], [role="row"]');
                    
                    if (row) {
                      var msgInfo = extractMessageFromRow(row);
                      if (msgInfo && msgInfo.has_unread) {
                        window.__WAS_MESSAGE_QUEUE.push(msgInfo);
                      }
                    }
                  }
                  
                  if (mutation.addedNodes) {
                    mutation.addedNodes.forEach(function(node) {
                      if (node.nodeType === Node.ELEMENT_NODE) {
                        var rows = node.querySelectorAll ? 
                          [node].concat(Array.from(node.querySelectorAll('[role="listitem"], [role="row"]'))) : [];
                        rows.forEach(function(row) {
                          var msgInfo = extractMessageFromRow(row);
                          if (msgInfo && msgInfo.has_unread) {
                            window.__WAS_MESSAGE_QUEUE.push(msgInfo);
                          }
                        });
                      }
                    });
                  }
                }
              });
              
              observer.observe(chatList, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['data-testid', 'aria-label']
              });
              
              window.__WAS_CHAT_OBSERVER = observer;
            }
            
            // Intercept notifications
            var OriginalNotification = window.Notification;
            window.Notification = function(title, options) {
              var msgInfo = {
                id: generateId(),
                from_me: false,
                sender: title,
                text: options?.body || '',
                message_type: 'chat',
                timestamp: new Date().toLocaleTimeString(),
                timestamp_unix: Date.now(),
                source: 'notification'
              };
              
              var uniqueKey = title + ':' + (options?.body || '');
              if (!window.__WAS_PROCESSED_IDS.has(uniqueKey)) {
                window.__WAS_PROCESSED_IDS.add(uniqueKey);
                window.__WAS_MESSAGE_QUEUE.push(msgInfo);
              }
              
              return new OriginalNotification(title, options);
            };
            Object.setPrototypeOf(window.Notification, OriginalNotification);
            window.Notification.permission = OriginalNotification.permission;
            window.Notification.requestPermission = OriginalNotification.requestPermission.bind(OriginalNotification);
            
            // Drain function
            window.__WAS_DRAIN_QUEUE = function() {
              return window.__WAS_MESSAGE_QUEUE.splice(0);
            };
            
            setupObserver();
            
            return { status: 'installed' };
          })();
        store_as: listener_status

      # 4. Drain the message queue
      - id: drain_queue
        action: eval
        script: |
          (function() {
            if (typeof window.__WAS_DRAIN_QUEUE === 'function') {
              return window.__WAS_DRAIN_QUEUE();
            }
            return [];
          })();
        store_as: new_messages

      - action: eval
        script: |
          ({
            messages: {{store.new_messages}},
            count: {{store.new_messages}}.length,
            status: '{{store.listener_status.status}}',
            listener_active: true
          })
        store_as: result

  - action: log
    message: "Watch returned {{store.result.count}} new messages"

output:
  messages: "{{store.result.messages}}"
  count: "{{store.result.count}}"
  status: "{{store.result.status}}"
  listener_active: "{{store.result.listener_active}}"
