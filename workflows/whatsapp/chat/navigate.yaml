# WhatsApp Navigate to Chat Workflow
#
# Opens a specific chat by phone number or contact name.
# Useful as a building block for other workflows.

name: whatsapp_navigate_chat
version: "1.0"
description: Navigate to a WhatsApp chat

browser:
  headless: false
  data_dir: "data/whatsapp_profile"

on:
  api:
    path: /whatsapp/navigate
    method: POST

params:
  phone:
    type: string
    required: false
    description: "Phone number with country code"
  name:
    type: string
    required: false
    description: "Contact or group name (alternative to phone)"

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  # 1. Validate input
  - id: validate
    action: eval
    script: |
      (function() {
        var hasPhone = '{{params.phone}}' && '{{params.phone}}'.trim().length > 0;
        var hasName = '{{params.name}}' && '{{params.name}}'.trim().length > 0;
        return { valid: hasPhone || hasName, hasPhone: hasPhone, hasName: hasName };
      })();
    store_as: input

  - action: condition
    if: "{{store.input.valid}} == false"
    then:
      - action: eval
        script: "({ status: 'invalid_input', success: false, error: 'Phone or name required' })"
        store_as: result
    else:
      # 2. Ensure WhatsApp Web is ready
      - action: call
        workflow: _common/ensure_ready
        store_as: ready

      # 3. Check auth
      - action: condition
        if: "{{store.ready.authorized}} == false"
        then:
          - action: eval
            script: "({ status: 'not_authenticated', success: false })"
            store_as: result
        else:
          # 4. Navigate based on input type
          - action: condition
            if: "{{store.input.hasPhone}} == true"
            then:
              # Use WhatsApp API deep link
              - id: nav_by_phone
                action: eval
                script: |
                  (function() {
                    var phone = '{{params.phone}}'.replace(/[^\d+]/g, '').replace(/^\+/, '');
                    var loader = document.querySelector('#phoneLoaderParent');
                    if (!loader) {
                      document.querySelector('#pane-side').innerHTML += '<div id="phoneLoaderParent"></div>';
                    }
                    document.querySelector('#phoneLoaderParent').innerHTML = 
                      '<a id="phoneLoader" href="https://api.whatsapp.com/send?phone=' + phone + '" style="display:none"></a>';
                    document.querySelector('#phoneLoader').click();
                    document.querySelector('#phoneLoaderParent').remove();
                    return phone;
                  })();
                store_as: navigated_phone
            else:
              # Click on chat in sidebar by name
              - id: nav_by_name
                action: eval
                script: |
                  (function() {
                    var targetName = '{{params.name}}';
                    var rows = document.querySelectorAll('[role="listitem"], [role="row"], [data-testid="cell-frame-container"]');
                    for (var row of rows) {
                      var nameEl = row.querySelector('[data-testid="cell-frame-title"] span') ||
                                   row.querySelector('span[title]') ||
                                   row.querySelector('[dir="auto"]');
                      if (nameEl && (nameEl.title === targetName || nameEl.innerText === targetName ||
                          nameEl.getAttribute('title') === targetName)) {
                        row.click();
                        return targetName;
                      }
                    }
                    return null;
                  })();
                store_as: navigated_name

          - action: sleep
            duration: "2s"

          # 5. Check if chat opened successfully
          - id: verify_chat
            action: eval
            script: |
              (function() {
                // Check for message input (indicates chat is open)
                var input = document.querySelector("#app #main footer div[aria-placeholder='Type a message']");
                if (input) {
                  // Get chat name from header
                  var header = document.querySelector('[data-testid="conversation-info-header-chat-title"]') ||
                               document.querySelector('#main header span[title]');
                  var chatName = header ? (header.innerText || header.title) : null;
                  return {
                    success: true,
                    chat_name: chatName
                  };
                }
                return { success: false, chat_name: null };
              })();
            store_as: verify

          - action: eval
            script: |
              ({
                status: {{store.verify.success}} ? 'navigated' : 'chat_not_found',
                success: {{store.verify.success}},
                chat_name: '{{store.verify.chat_name}}'
              })
            store_as: result

  - action: log
    message: "Navigate completed: {{store.result.status}}"

output:
  status: "{{store.result.status}}"
  success: "{{store.result.success}}"
  chat_name: "{{store.result.chat_name}}"
