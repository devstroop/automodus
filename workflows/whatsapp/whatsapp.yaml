# WhatsApp Automation — Single Entry Point
#
# Composes all WhatsApp sub-workflows into one workflow using the `call` action.
# Pass `action` to select the operation, plus relevant parameters.
#
# Usage:
#   automodus run workflows/whatsapp/whatsapp.yaml action=check_status
#   automodus run workflows/whatsapp/whatsapp.yaml action=send_text phone=+919876543210 message="Hello!"
#   automodus run workflows/whatsapp/whatsapp.yaml action=get_chats limit=20
#
# Available actions:
#   Auth:      check_status, qr_login, phone_login, logout
#   Messaging: send, send_text, send_media, send_document
#   Chat:      get_chats, get_messages, navigate, watch

name: whatsapp
version: "1.0"
description: WhatsApp Web automation — single entry point with sub-workflow dispatch

browser:
  headless: false
  data_dir: "data/whatsapp_profile"
  width: 1280
  height: 800

params:
  action:
    type: string
    required: true
    description: "Operation to perform (check_status, qr_login, phone_login, logout, send, send_text, send_media, send_document, get_chats, get_messages, navigate, watch)"
  # Auth params
  phone_number:
    type: string
    description: "Phone number for phone_login (with country code)"
  # Messaging params
  phone:
    type: string
    description: "Recipient phone number (with country code)"
  message:
    type: string
    description: "Text message or caption"
  file:
    type: string
    description: "File path for universal send"
  file_path:
    type: string
    description: "File path for send_media / send_document"
  caption:
    type: string
    description: "Caption for media/document"
  # Chat params
  limit:
    type: number
    default: 50
    description: "Max items to return (get_chats, get_messages)"
  chat_id:
    type: string
    description: "Chat ID for get_messages (phone, JID, or name:ContactName)"
  name:
    type: string
    description: "Contact name for navigate"
  load_more:
    type: boolean
    default: false
    description: "Scroll to load more messages"

steps:
  # ── Validate action ────────────────────────────────────────────
  - id: validate
    action: eval
    script: |
      (function() {
        var actions = [
          'check_status', 'qr_login', 'phone_login', 'logout',
          'send', 'send_text', 'send_media', 'send_document',
          'get_chats', 'get_messages', 'navigate', 'watch'
        ];
        var action = '{{params.action}}';
        return { valid: actions.indexOf(action) !== -1, action: action };
      })();
    store_as: validated

  - action: condition
    if: "{{store.validated.valid}} == false"
    then:
      - action: eval
        script: "({ status: 'invalid_action', success: false, error: 'Unknown action: {{params.action}}. Valid: check_status, qr_login, phone_login, logout, send, send_text, send_media, send_document, get_chats, get_messages, navigate, watch' })"
        store_as: result

  # ── Auth: check_status ─────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'check_status'"
    then:
      - action: call
        workflow: auth/check_status
        store_as: result

  # ── Auth: qr_login ─────────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'qr_login'"
    then:
      - action: call
        workflow: auth/qr_login
        store_as: result

  # ── Auth: phone_login ──────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'phone_login'"
    then:
      - action: call
        workflow: auth/phone_login
        params:
          phone_number: "{{params.phone_number}}"
        store_as: result

  # ── Auth: logout ────────────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'logout'"
    then:
      - action: call
        workflow: auth/logout
        store_as: result

  # ── Messaging: send (universal) ────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'send'"
    then:
      - action: call
        workflow: messaging/send
        params:
          phone: "{{params.phone}}"
          message: "{{params.message}}"
          file: "{{params.file}}"
        store_as: result

  # ── Messaging: send_text ────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'send_text'"
    then:
      - action: call
        workflow: messaging/send_text
        params:
          phone: "{{params.phone}}"
          message: "{{params.message}}"
        store_as: result

  # ── Messaging: send_media ───────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'send_media'"
    then:
      - action: call
        workflow: messaging/send_media
        params:
          phone: "{{params.phone}}"
          file_path: "{{params.file_path}}"
          caption: "{{params.caption}}"
        store_as: result

  # ── Messaging: send_document ────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'send_document'"
    then:
      - action: call
        workflow: messaging/send_document
        params:
          phone: "{{params.phone}}"
          file_path: "{{params.file_path}}"
          caption: "{{params.caption}}"
        store_as: result

  # ── Chat: get_chats ─────────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'get_chats'"
    then:
      - action: call
        workflow: chat/get_chats
        params:
          limit: "{{params.limit}}"
        store_as: result

  # ── Chat: get_messages ──────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'get_messages'"
    then:
      - action: call
        workflow: chat/get_messages
        params:
          chat_id: "{{params.chat_id}}"
          limit: "{{params.limit}}"
          load_more: "{{params.load_more}}"
        store_as: result

  # ── Chat: navigate ──────────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'navigate'"
    then:
      - action: call
        workflow: chat/navigate
        params:
          phone: "{{params.phone}}"
          name: "{{params.name}}"
        store_as: result

  # ── Chat: watch ─────────────────────────────────────────────────
  - action: condition
    if: "{{params.action}} == 'watch'"
    then:
      - action: call
        workflow: chat/watch_messages
        store_as: result

  # ── Final log ───────────────────────────────────────────────────
  - action: log
    message: "whatsapp:{{params.action}} → {{store.result.status}}"

output:
  action: "{{params.action}}"
  result: "{{store.result}}"

on_error:
  screenshot: true
  emit:
    event: whatsapp_error
    data:
      action: "{{params.action}}"
