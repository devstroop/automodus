# WhatsApp Phone Number Login Workflow
#
# Authenticates to WhatsApp Web using phone number + verification code.
# Returns the verification code that needs to be entered on the user's phone.

name: whatsapp_phone_login
version: "1.0"
description: Login to WhatsApp Web using phone number

browser:
  headless: false
  data_dir: "data/whatsapp_profile"

on:
  api:
    path: /whatsapp/auth/phone
    method: POST

params:
  phone_number:
    type: string
    required: true
    description: "Full phone number with country code (e.g., +919876543210)"

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  # 1. Ensure WhatsApp Web is loaded
  - action: call
    workflow: _common/ensure_ready
    store_as: ready

  - id: wait_for_page
    action: wait_for
    selector: "text:Log in with phone number"
    timeout: 30000

  - id: click_phone_login
    action: click
    selector: "text:Log in with phone number"

  - id: select_country
    action: eval
    script: |
      (async function() {
        const fullPhone = '{{params.phone_number}}';
        
        // Country code to country name mapping
        const ccMap = {
          '+1': 'United States', '+7': 'Russia', '+20': 'Egypt', '+27': 'South Africa',
          '+30': 'Greece', '+31': 'Netherlands', '+32': 'Belgium', '+33': 'France',
          '+34': 'Spain', '+36': 'Hungary', '+39': 'Italy', '+40': 'Romania',
          '+41': 'Switzerland', '+43': 'Austria', '+44': 'United Kingdom', '+45': 'Denmark',
          '+46': 'Sweden', '+47': 'Norway', '+48': 'Poland', '+49': 'Germany',
          '+51': 'Peru', '+52': 'Mexico', '+53': 'Cuba', '+54': 'Argentina',
          '+55': 'Brazil', '+56': 'Chile', '+57': 'Colombia', '+58': 'Venezuela',
          '+60': 'Malaysia', '+61': 'Australia', '+62': 'Indonesia', '+63': 'Philippines',
          '+64': 'New Zealand', '+65': 'Singapore', '+66': 'Thailand', '+81': 'Japan',
          '+82': 'South Korea', '+84': 'Vietnam', '+86': 'China', '+90': 'Turkey',
          '+91': 'India', '+92': 'Pakistan', '+93': 'Afghanistan', '+94': 'Sri Lanka',
          '+95': 'Myanmar', '+98': 'Iran', '+212': 'Morocco', '+213': 'Algeria',
          '+216': 'Tunisia', '+218': 'Libya', '+220': 'Gambia', '+221': 'Senegal',
          '+234': 'Nigeria', '+249': 'Sudan', '+254': 'Kenya', '+255': 'Tanzania',
          '+256': 'Uganda', '+260': 'Zambia', '+263': 'Zimbabwe', '+351': 'Portugal',
          '+352': 'Luxembourg', '+353': 'Ireland', '+354': 'Iceland', '+358': 'Finland',
          '+370': 'Lithuania', '+371': 'Latvia', '+372': 'Estonia', '+380': 'Ukraine',
          '+381': 'Serbia', '+385': 'Croatia', '+386': 'Slovenia', '+420': 'Czech Republic',
          '+421': 'Slovakia', '+852': 'Hong Kong', '+853': 'Macau', '+855': 'Cambodia',
          '+880': 'Bangladesh', '+886': 'Taiwan', '+960': 'Maldives', '+961': 'Lebanon',
          '+962': 'Jordan', '+963': 'Syria', '+964': 'Iraq', '+965': 'Kuwait',
          '+966': 'Saudi Arabia', '+967': 'Yemen', '+968': 'Oman', '+970': 'Palestine',
          '+971': 'United Arab Emirates', '+972': 'Israel', '+973': 'Bahrain', '+974': 'Qatar',
          '+975': 'Bhutan', '+976': 'Mongolia', '+977': 'Nepal', '+994': 'Azerbaijan',
          '+995': 'Georgia', '+998': 'Uzbekistan'
        };
        
        // Parse country code and local number
        let countryCode = '';
        let localNumber = fullPhone;
        if (fullPhone.startsWith('+')) {
          for (let len of [4, 3, 2]) {
            const prefix = fullPhone.substring(0, len);
            if (ccMap[prefix]) {
              countryCode = prefix;
              localNumber = fullPhone.substring(len);
              break;
            }
          }
        }
        const countryName = ccMap[countryCode] || '';
        
        // Wait for country button to appear
        await new Promise(r => setTimeout(r, 1000));
        
        if (countryName) {
          // Click country selector button (has flag emoji)
          const countryBtn = Array.from(document.querySelectorAll('button')).find(b => 
            b.querySelector('img[alt]') && b.textContent.match(/[A-Z][a-z]+/)
          );
          if (countryBtn) {
            countryBtn.click();
            await new Promise(r => setTimeout(r, 500));
            
            // Type in search box (contenteditable div)
            const searchBox = document.querySelector('[role="textbox"][contenteditable="true"]') ||
                              document.querySelector('div[contenteditable="true"]');
            if (searchBox) {
              searchBox.focus();
              searchBox.textContent = countryName;
              searchBox.dispatchEvent(new Event('input', { bubbles: true }));
              await new Promise(r => setTimeout(r, 500));
              
              // Click matching country in listbox
              const listbox = document.querySelector('[role="listbox"]');
              if (listbox) {
                const countryBtns = listbox.querySelectorAll('button');
                for (const btn of countryBtns) {
                  if (btn.textContent.toLowerCase().includes(countryName.toLowerCase())) {
                    btn.click();
                    break;
                  }
                }
              }
            }
            await new Promise(r => setTimeout(r, 300));
          }
        }
        
        return { countryCode, localNumber, countryName };
      })();
    store_as: parsed_phone

  - id: fill_phone
    action: eval
    script: |
      (async function() {
        const localNumber = '{{store.parsed_phone.localNumber}}';
        
        // Find phone input
        const input = document.querySelector('[aria-label*="phone number"]') ||
                      document.querySelector('input[type="tel"]');
        if (!input) return { status: 'input_not_found' };
        
        // Clear and fill
        input.focus();
        input.select && input.select();
        document.execCommand('selectAll', false, null);
        document.execCommand('delete', false, null);
        
        // Type digits
        for (const char of localNumber) {
          document.execCommand('insertText', false, char);
          await new Promise(r => setTimeout(r, 30));
        }
        
        return { status: 'filled', number: localNumber };
      })();
    store_as: fill_result

  - id: click_next
    action: eval
    script: |
      (async () => {
        // Wait for Next button to appear (up to 10s)
        for (let i = 0; i < 50; i++) {
          const btn = [...document.querySelectorAll('button')].find(b => 
            b.textContent.trim() === 'Next' || b.textContent.includes('Next')
          );
          if (btn) {
            btn.scrollIntoView({ behavior: 'instant', block: 'center' });
            btn.click();
            return { status: 'clicked' };
          }
          await new Promise(r => setTimeout(r, 200));
        }
        // Debug: list all buttons
        const allBtns = [...document.querySelectorAll('button')].map(b => b.textContent.trim().substring(0, 50));
        return { status: 'not_found', buttons: allBtns };
      })();
    store_as: next_result

  - id: get_code
    action: eval
    script: |
      (async function() {
        // Wait for code screen (up to 15s)
        for (let i = 0; i < 75; i++) {
          // Try data-link-code attribute first
          const linkEl = document.querySelector('[data-link-code]');
          if (linkEl) {
            const raw = linkEl.getAttribute('data-link-code');
            const parts = raw.split(',');
            if (parts.length === 8) {
              return { status: 'code_ready', verification_code: parts.slice(0,4).join('') + '-' + parts.slice(4).join('') };
            }
          }
          
          // Try aria-label container
          const codeContainer = document.querySelector('[aria-label="Enter code on phone:"]');
          if (codeContainer) {
            const chars = [];
            codeContainer.querySelectorAll('span, div').forEach(el => {
              const t = el.textContent.trim();
              if (t.length === 1 && /[A-Z0-9]/.test(t)) chars.push(t);
            });
            if (chars.length >= 8) {
              return { status: 'code_ready', verification_code: chars.slice(0,4).join('') + '-' + chars.slice(4,8).join('') };
            }
          }
          
          await new Promise(r => setTimeout(r, 200));
        }
        
        return { status: 'code_not_found', verification_code: null };
      })();
    store_as: result

  - action: log
    message: "Phone login: {{store.result.status}} - Code: {{store.result.verification_code}}"

output:
  status: "{{store.result.status}}"
  verification_code: "{{store.result.verification_code}}"
