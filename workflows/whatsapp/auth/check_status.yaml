# WhatsApp Authentication Status Check
#
# Checks whether the user is authenticated to WhatsApp Web.
# Returns detailed status information including loading states.

name: whatsapp_check_status
version: "1.0"
description: Check WhatsApp Web authentication status

browser:
  headless: false
  data_dir: "data/whatsapp_profile"

on:
  api:
    path: /whatsapp/auth/status
    method: GET

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  - id: navigate
    action: goto
    url: "{{vars.whatsapp_url}}"

  - id: check_auth
    action: eval
    script: |
      (async function() {
        const maxWait = 15000;
        const start = Date.now();
        
        while (Date.now() - start < maxWait) {
          // Loading indicator
          if (document.querySelector('progress[max="100"]')) {
            await new Promise(r => setTimeout(r, 500));
            continue;
          }
          
          // Authenticated - chat pane visible
          const chatPane = document.querySelector('#pane-side, [data-testid="chat-list"]');
          if (chatPane) {
            const wid = (localStorage.getItem('last-wid') || localStorage.getItem('last-wid-md') || '').replace(/"/g, '');
            return {
              authorized: true,
              status: 'authenticated',
              reason: 'Chat pane visible',
              sender_id: wid ? wid.split('@')[0].split(':')[0] : null
            };
          }
          
          // QR code ready
          if (document.querySelector("[aria-label='Scan this QR code to link a device!']")) {
            return { authorized: false, status: 'qr_ready', reason: 'QR code displayed', sender_id: null };
          }
          
          // Phone entry
          if (document.querySelector('input[aria-label="Type your phone number."]')) {
            return { authorized: false, status: 'phone_entry', reason: 'Phone number entry', sender_id: null };
          }
          
          // Code entry
          if (document.querySelector('[aria-details="link-device-phone-number-code-screen-instructions"]')) {
            return { authorized: false, status: 'code_entry', reason: 'Code entry screen', sender_id: null };
          }
          
          // Login screen (fallback)
          if (document.body.innerText.includes('Steps to log in')) {
            return { authorized: false, status: 'login_screen', reason: 'Login screen', sender_id: null };
          }
          
          await new Promise(r => setTimeout(r, 300));
        }
        
        return { authorized: false, status: 'timeout', reason: 'Page did not load in time', sender_id: null };
      })();
    store_as: auth_status

  - action: log
    message: "Auth: {{store.auth_status.status}} - {{store.auth_status.reason}}"

output:
  authorized: "{{store.auth_status.authorized}}"
  status: "{{store.auth_status.status}}"
  reason: "{{store.auth_status.reason}}"
  sender_id: "{{store.auth_status.sender_id}}"
