# Shared Helper: Open Chat by Phone Number
#
# Navigates to a specific WhatsApp chat using the deep link API.
# Assumes WhatsApp Web is already loaded and authenticated.
#
# Params:
#   phone: Phone number with country code (e.g., "+919876543210")
#
# Output:
#   success: boolean - whether the chat opened
#   phone: string - cleaned phone number

name: _open_chat
version: "1.0"
description: Open a WhatsApp chat by phone number

params:
  phone:
    type: string
    required: true
    description: "Phone number with country code"

steps:
  # Navigate via WhatsApp deep link
  - id: navigate_to_chat
    action: eval
    script: |
      (function() {
        var phone = '{{params.phone}}'.replace(/[^\d+]/g, '').replace(/^\+/, '');
        var loader = document.querySelector('#phoneLoaderParent');
        if (!loader) {
          document.querySelector('#pane-side').innerHTML += '<div id="phoneLoaderParent"></div>';
        }
        document.querySelector('#phoneLoaderParent').innerHTML = 
          '<a id="phoneLoader" href="https://api.whatsapp.com/send?phone=' + phone + '" style="display:none"></a>';
        document.querySelector('#phoneLoader').click();
        document.querySelector('#phoneLoaderParent').remove();
        return phone;
      })();
    store_as: cleaned_phone

  - action: sleep
    duration: "2s"

  # Check for invalid phone dialog
  - id: check_invalid
    action: eval
    script: |
      (function() {
        var dialog = document.querySelector('#app div[data-animate-modal-popup="true"] div[data-animate-modal-body="true"] div');
        if (dialog && dialog.innerHTML.trim() === 'Phone number shared via url is invalid.') {
          var btns = document.querySelectorAll('#app div[data-animate-modal-popup="true"] button');
          if (btns.length > 0) btns[btns.length - 1].click();
          return true;
        }
        return false;
      })();
    store_as: is_invalid

  # Wait for message input (confirms chat is open)
  - id: wait_for_input
    action: eval
    script: |
      (async function() {
        for (var i = 0; i < 50; i++) {
          if (document.querySelector("#app #main footer div[aria-placeholder='Type a message']")) {
            return true;
          }
          await new Promise(r => setTimeout(r, 200));
        }
        return false;
      })();
    store_as: chat_ready

  - id: build_result
    action: eval
    script: |
      ({
        success: {{store.is_invalid}} ? false : {{store.chat_ready}},
        phone: '{{store.cleaned_phone}}',
        error: {{store.is_invalid}} ? 'Invalid phone number' : ({{store.chat_ready}} ? null : 'Chat did not open')
      })
    store_as: result

output:
  success: "{{store.result.success}}"
  phone: "{{store.result.phone}}"
  error: "{{store.result.error}}"
