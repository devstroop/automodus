# Shared Helper: Ensure WhatsApp Web is Ready
#
# Navigates to WhatsApp Web and checks authentication status.
# Used as a building block by all other WhatsApp workflows.
#
# Output:
#   authorized: boolean - whether user is authenticated
#   status: string - "authenticated", "qr_ready", "loading", "unknown"

name: _ensure_ready
version: "1.0"
description: Navigate to WhatsApp Web and check auth status

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  - id: navigate
    action: goto
    url: "{{vars.whatsapp_url}}"

  - id: wait_initial
    action: sleep
    duration: "2s"

  - id: check_auth
    action: eval
    script: |
      (function() {
        var chatPane = document.querySelector('#pane-side') ||
                       document.querySelector('[data-testid="chat-list"]');
        if (chatPane) {
          return { authorized: true, status: 'authenticated' };
        }
        if (document.querySelector("[aria-label='Scan this QR code to link a device!']")) {
          return { authorized: false, status: 'qr_ready' };
        }
        if (document.querySelector('progress[max="100"]')) {
          return { authorized: false, status: 'loading' };
        }
        return { authorized: false, status: 'unknown' };
      })();
    store_as: auth

output:
  authorized: "{{store.auth.authorized}}"
  status: "{{store.auth.status}}"
