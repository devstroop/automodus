# WhatsApp Send Message (Combined) Workflow
#
# Universal send workflow that handles text, images/videos, or documents.
# Automatically detects the type based on provided parameters.
#
# Usage:
#   phone: Phone number (required)
#   message: Text message (optional)
#   file: Path to attachment file (optional)
#   
# At least one of message or file must be provided.
# If file is provided, message becomes the caption.

name: whatsapp_send
version: "1.0"
description: Send message or file via WhatsApp

browser:
  headless: false
  data_dir: "data/whatsapp_profile"

on:
  api:
    path: /whatsapp/send
    method: POST

params:
  phone:
    type: string
    required: true
    description: "Phone number with country code"
  message:
    type: string
    required: false
    description: "Text message or caption for file"
  file:
    type: string
    required: false
    description: "Path to file (image, video, or document)"

vars:
  whatsapp_url: "https://web.whatsapp.com"

steps:
  # 1. Validate input
  - id: validate_input
    action: eval
    script: |
      (function() {
        var hasMessage = '{{params.message}}' && '{{params.message}}'.trim().length > 0;
        var hasFile = '{{params.file}}' && '{{params.file}}'.trim().length > 0;
        return {
          valid: hasMessage || hasFile,
          has_message: hasMessage,
          has_file: hasFile
        };
      })();
    store_as: input_check

  - action: condition
    if: "{{store.input_check.valid}} == false"
    then:
      - action: eval
        script: "({ status: 'invalid_input', success: false, error: 'Message or file required' })"
        store_as: result
    else:
      # 2. Ensure WhatsApp Web is ready
      - action: call
        workflow: _common/ensure_ready
        store_as: ready

      - action: condition
        if: "{{store.ready.authorized}} == false"
        then:
          - action: eval
            script: "({ status: 'not_authenticated', success: false })"
            store_as: result
        else:
          # 3. Open chat by phone number
          - action: call
            workflow: _common/open_chat
            params:
              phone: "{{params.phone}}"
            store_as: chat

          - action: condition
            if: "{{store.chat.success}} == false"
            then:
              - action: eval
                script: "({ status: 'chat_not_found', success: false, error: '{{store.chat.error}}' })"
                store_as: result
            else:
              # 4. Branch based on whether we have a file
          - action: condition
            if: "{{store.input_check.has_file}} == true"
            then:
              # Send file (with optional caption)
              - id: detect_file_type
                action: eval
                script: |
                  (function() {
                    var filePath = '{{params.file}}';
                    var ext = filePath.split('.').pop().toLowerCase();
                    var imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                    var videoExts = ['mp4', '3gpp', 'mov', 'avi', 'mkv'];
                    if (imageExts.includes(ext) || videoExts.includes(ext)) {
                      return 'media';
                    }
                    return 'document';
                  })();
                store_as: file_type

              # Click attach
              - action: eval
                script: |
                  (function() {
                    var btn = document.querySelector('button[title="Attach"]') ||
                              document.querySelector('span[data-icon="plus"]')?.closest('button');
                    if (btn) { btn.click(); return true; }
                    return false;
                  })();
              
              - action: sleep
                duration: "500ms"

              # Click appropriate menu item
              - action: condition
                if: "{{store.file_type}} == 'media'"
                then:
                  - action: eval
                    script: |
                      (function() {
                        var item = document.querySelector('[role="menuitem"][aria-label="Photos & videos"]') ||
                                   document.querySelector('[role="menuitem"][aria-label*="Photo"]');
                        if (item) { item.click(); return true; }
                        return false;
                      })();
                  - action: sleep
                    duration: "500ms"
                  - action: upload
                    selector: "input[accept='image/*,video/mp4,video/3gpp,video/quicktime']"
                    file: "{{params.file}}"
                else:
                  - action: eval
                    script: |
                      (function() {
                        var item = document.querySelector('[role="menuitem"][aria-label="Document"]') ||
                                   document.querySelector('[role="menuitem"][aria-label*="Document"]');
                        if (item) { item.click(); return true; }
                        return false;
                      })();
                  - action: sleep
                    duration: "500ms"
                  - action: upload
                    selector: "input[accept='*']"
                    file: "{{params.file}}"

              # Wait for preview
              - action: wait_for
                selector: "div[aria-label='Send']"
                timeout: "15s"

              # Add caption if message provided
              - action: condition
                if: "{{store.input_check.has_message}} == true"
                then:
                  - action: eval
                    script: |
                      (function() {
                        var inputs = document.querySelectorAll('div[contenteditable="true"][role="textbox"]');
                        for (var input of inputs) {
                          var label = input.getAttribute('aria-label') || '';
                          var placeholder = input.getAttribute('aria-placeholder') || '';
                          if (label.includes('message') || label.includes('caption') ||
                              placeholder.includes('message') || placeholder.includes('caption')) {
                            input.focus();
                            document.execCommand('insertText', false, '{{params.message}}');
                            return true;
                          }
                        }
                        return false;
                      })();
                  - action: sleep
                    duration: "300ms"

              # Send file
              - action: eval
                script: |
                  (function() {
                    var btn = document.querySelector('div[aria-label="Send"]') ||
                              document.querySelector('span[data-icon="send"]')?.closest('div[role="button"]');
                    if (btn) { btn.click(); return true; }
                    return false;
                  })();
                store_as: sent_file

              - action: eval
                script: |
                  ({
                    status: {{store.sent_file}} ? 'sent' : 'send_failed',
                    success: {{store.sent_file}},
                    type: '{{store.file_type}}'
                  })
                store_as: result

            else:
              # Send text only
              - action: eval
                script: |
                  (function() {
                    var input = document.querySelector("#app #main footer div[aria-placeholder='Type a message']");
                    if (!input) return false;
                    input.focus();
                    var lines = '{{params.message}}'.split('\\n');
                    for (var i = 0; i < lines.length; i++) {
                      document.execCommand('insertText', false, lines[i]);
                      if (i < lines.length - 1) {
                        document.execCommand('insertLineBreak');
                      }
                    }
                    return true;
                  })();

              - action: sleep
                duration: "300ms"

              - action: eval
                script: |
                  (function() {
                    var btn = document.querySelector('button[aria-label="Send"]') ||
                              document.querySelector('span[data-icon="send"]')?.closest('button');
                    if (btn) { btn.click(); return true; }
                    return false;
                  })();
                store_as: sent_text

              - action: eval
                script: |
                  ({
                    status: {{store.sent_text}} ? 'sent' : 'send_failed',
                    success: {{store.sent_text}},
                    type: 'text'
                  })
                store_as: result

  - action: log
    message: "Send completed: {{store.result.status}} ({{store.result.type}})"

output:
  status: "{{store.result.status}}"
  success: "{{store.result.success}}"
  type: "{{store.result.type}}"
  phone: "{{params.phone}}"

on_error:
  screenshot: true
  emit:
    event: whatsapp_send_error
