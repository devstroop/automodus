name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Build
        run: cargo build

      - name: Build with MCP
        run: cargo build --features mcp

      - name: Run tests
        run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Clippy
        run: cargo clippy --features mcp -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  smoke:
    name: "Examples (${{ matrix.engine }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, lightpanda]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Build
        run: cargo build

      - name: Install Lightpanda
        if: matrix.engine == 'lightpanda'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/lightpanda" \
            https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x "$HOME/.local/bin/lightpanda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check browsers
        run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            command -v google-chrome || command -v google-chrome-stable || command -v chromium || { echo "no Chromium-family browser on runner"; exit 1; }
          fi
          if [ "${{ matrix.engine }}" = "firefox" ]; then
            command -v firefox || { echo "no firefox on runner"; exit 1; }
          fi

      - name: "Ensure Xvfb (examples set headless: false)"
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run example smoke suite
        run: scripts/smoke.sh "${{ matrix.engine }}"
