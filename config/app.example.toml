# automodus example configuration
#
# Copy to config/app.toml (path overridable with AUTOMODUS_CONFIG).
# Any AUTOMODUS_* environment variable also overrides the matching key,
# e.g. AUTOMODUS_BROWSER_ENGINE=firefox, AUTOMODUS_SERVER_PORT=8081.
#
# Unknown keys are silently ignored, so sections marked "reserved" below
# are accepted but currently have no effect. See docs/SHELL.md §
# Configuration for details.

# =============================================================================
# Read by the code
# =============================================================================

[server]
# HTTP server bind address (used by `serve` / HTTP paths; default 127.0.0.1)
host = "127.0.0.1"
# HTTP port for the foreground server (default 3000).
# NOTE: `automodus daemon start` serves on 127.0.0.1:8080 from daemon
# defaults, not from this file (the daemon TOML loader is not wired yet).
port = 3000

[browser]
# Browser engine backend: "chromium" (CDP), "firefox" (WebDriver BiDi, no
# geckodriver), or "lightpanda" (CDP attach to spawned `lightpanda serve`)
engine = "chromium"
# Headless mode for daemon/API-launched browsers (default false).
# `automodus run` uses the workflow's own `browser.headless` instead.
headless = false
# Default timeout in milliseconds (consumed only by the legacy
# BrowserService driver; launch paths use their own defaults)
timeout_ms = 30000

# Optional: explicit browser binary paths (omit to auto-detect)
# Resolution order for Chrome: AUTOMODUS_CHROME_PATH > CHROME > these keys >
# system discovery.
# chrome_path = "/usr/bin/google-chrome"
# firefox_path = "/usr/bin/firefox"
# lightpanda_path = "/home/you/.local/bin/lightpanda"

# Additional browser arguments (applied by the legacy BrowserService driver;
# the current launch_session path builds its own flags)
# args = [
#     "--disable-blink-features=AutomationControlled",
#     "--no-sandbox",
#     "--disable-dev-shm-usage",
# ]

# Persistent browser profile directory.
# reserved: defined in config but never read by the launch paths —
# runs use an isolated TempProfile that is removed on exit.
# user_data_dir = "/home/you/.chromium-profile"

# =============================================================================
# Reserved — accepted but currently ignored
# =============================================================================
#
# The keys below parse cleanly but are not read by any runtime path today.
# Keep them commented out unless you are prototyping a future schema.

# [workflows]
# directory = "workflows"     # reserved: workflows are located via the
#                             # AUTOMODUS_WORKFLOWS env var (default workflows/)
# auto_reload = false         # reserved: never read

# [auth]                      # reserved: no auth layer exists (API is
#                             # unauthenticated and binds 127.0.0.1)
# secret_key = "change-this-secret-key-in-production"
# jwt_secret = "your-super-secret-jwt-key-change-this-in-production-32chars"
# token_expiry_hours = 24
# refresh_token_expiry_days = 7

# [logging]                   # reserved: use RUST_LOG / LOG_JSON instead
# level = "info"

# [cache]                     # reserved
# default_ttl_minutes = 15

# [cors]                      # reserved: the HTTP layer allows all origins
# allow_origins = ["*"]
# allow_methods = ["GET", "POST", "DELETE", "OPTIONS"]
# allow_headers = ["authorization", "content-type"]

# [limits]                    # reserved
# max_concurrent_requests = 50
# request_timeout_ms = 30000
# max_upload_size = 10485760

# [environment]               # reserved
# environment = "development"
# log_level = "info"
# health_check_interval = 30

# [web]                       # reserved: no built-in web UI
# enabled = false

# [swagger]                   # reserved: Swagger UI is always mounted at
#                             # /swagger-ui (openapi at /api/openapi.json)
# enabled = true
# path = "/swagger-ui"

# [mcp]                       # reserved: MCP support is a compile-time
#                             # feature (--features mcp), not a config toggle
# enabled = false
# endpoint = "/mcp"
# sse_enabled = true
# heartbeat_interval_secs = 30

# [webhooks]                  # reserved: no webhook dispatcher
# enabled = false
# timeout_ms = 5000
# retry_count = 3
# retry_delay_ms = 1000
